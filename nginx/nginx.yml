# Eigene Docker-Compose-Datei für einen einfachen Webserver mit nginx (https://hub.docker.com/_/nginx)
# Host-Port 8080 statt 80, damit es nicht mit Pihole (belegt Port 80) kollidiert.

services:
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - './html:/usr/share/nginx/html:ro'
    restart: unless-stopped
